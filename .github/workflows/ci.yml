name: Android CI

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Step 1 - Code Quality (Ktlint & Detekt)
      run: ./gradlew ktlintCheck detekt

    - name: Step 2 - Smoke Test (Build Debug)
      run: ./gradlew assembleDebug

    - name: Step 3 - Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Step 4 - Android Lint
      run: ./gradlew lintDebug

    - name: Step 5 - Packaging (Assemble Release)
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: app-release
          path: .

      - name: Step 6 - Deployment (GitHub Release)
        uses: softprops/action-gh-release@v1
        with:
          files: app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
